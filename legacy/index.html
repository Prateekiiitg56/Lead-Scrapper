<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unbias.xai — AI Automation Agency</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ── CSS Reset & Variables ── */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg-dark: #08090b;
    --bg-bottom: #0d0f14;
    --text-primary: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.60);
    --text-dim: rgba(255, 255, 255, 0.35);
    --border-color: rgba(255, 255, 255, 0.08);
    --accent: #ffffff;
    --accent-hover: rgba(255, 255, 255, 0.9);
    --accent-dark: rgba(255, 255, 255, 0.04);
    --accent-glow: rgba(255, 255, 255, 0.25);
    
    --font-heading: 'Instrument Serif', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    background-color: var(--bg-dark);
    color: var(--text-primary);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layer 0: Fixed Backdrop Gradient & Center Bloom ── */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-bottom) 100%);
    pointer-events: none;
  }

  .backdrop::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 90% at 50% 40%, rgba(37, 211, 102, 0.06), transparent 55%);
  }

  /* ── Layer 1: Grain & Micro-Texture Overlay ── */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    opacity: 0.15;
    pointer-events: none;
    background-image: radial-gradient(rgba(232, 233, 236, 0.12) 1px, transparent 0);
    background-size: 24px 24px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 100%);
  }

  /* ── Layer 2: Three.js Network Canvas ── */
  #bgCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 2;
    pointer-events: none;
  }

  /* ── Layer 3: Legibility Bloom behind H1 ── */
  .art-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    width: min(760px, 90vw);
    aspect-ratio: 1.4;
    background: radial-gradient(ellipse at center, rgba(15, 17, 21, 0.85) 0%, rgba(15, 17, 21, 0.55) 34%, transparent 66%);
    pointer-events: none;
  }

  /* ── Entrance Animation ── */
  @keyframes blurFadeUp {
    from {
      opacity: 0;
      filter: blur(20px);
      transform: translateY(38px);
    }
    to {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0);
    }
  }

  .rise {
    opacity: 0;
    animation: blurFadeUp 1s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }

  /* ── Main Layout Container ── */
  .hero-shell {
    position: relative;
    z-index: 10;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
  }

  /* ── Top Navigation ── */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(16px, 4vh, 30px) clamp(20px, 5vw, 56px);
    width: 100%;
  }

  /* Wordmark */
  .wordmark {
    display: flex;
    align-items: center;
    gap: 11px;
    font-family: var(--font-heading);
    font-size: clamp(17px, 2vw, 20px);
    font-weight: 800;
    letter-spacing: 0.03em;
    color: var(--text-primary);
    text-decoration: none;
  }

  .wordmark-logo {
    width: 17px;
    height: 17px;
    color: var(--accent);
    flex-shrink: 0;
  }

  /* Nav Links */
  .nav-links {
    display: flex;
    align-items: center;
    gap: clamp(20px, 3vw, 36px);
    list-style: none;
  }

  .nav-links a {
    font-family: var(--font-body);
    font-size: 14.5px;
    font-weight: 500;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.25s ease;
  }

  .nav-links a:hover {
    color: #ffffff;
  }

  /* Nav CTA */
  .btn-nav-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-heading);
    font-size: clamp(13px, 1.2vw, 14.5px);
    font-weight: 600;
    color: var(--accent-dark);
    background-color: var(--accent);
    padding: clamp(8px, 1vh, 10px) clamp(16px, 2vw, 22px);
    border-radius: 9999px;
    text-decoration: none;
    box-shadow: 0 10px 26px -12px var(--accent-glow);
    transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    white-space: nowrap;
  }

  .btn-nav-cta:hover {
    transform: translateY(-1px);
    background-color: var(--accent-hover);
    box-shadow: 0 14px 30px -10px rgba(37, 211, 102, 0.45);
  }

  /* ── Hero Content Section ── */
  .hero-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(20px, 3vh, 40px) 20px;
    max-width: 960px;
    margin: 0 auto;
    width: 100%;
  }

  /* Kicker */
  .kicker-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: clamp(16px, 3vh, 30px);
  }

  .kicker-rule {
    width: clamp(20px, 3vw, 28px);
    height: 1px;
    background-color: var(--accent);
    opacity: 0.6;
  }

  .kicker-text {
    font-family: var(--font-mono);
    font-size: clamp(10px, 1.2vw, 12px);
    font-weight: 500;
    letter-spacing: clamp(0.2em, 0.4em, 0.4em);
    text-transform: uppercase;
    color: var(--accent);
  }

  /* H1 Headline */
  .headline {
    font-family: var(--font-heading);
    font-size: clamp(32px, 5.8vw, 84px);
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin-bottom: clamp(16px, 3vh, 30px);
  }

  .headline-line1 {
    display: block;
    font-weight: 400;
    color: rgba(232, 233, 236, 0.82);
  }

  .headline-line2 {
    display: block;
    font-weight: 800;
    color: #ffffff;
  }

  /* Subtitle */
  .subtitle {
    font-family: var(--font-body);
    font-size: clamp(14px, 1.35vw, 19px);
    font-weight: 400;
    color: var(--text-muted);
    max-width: 480px;
    line-height: 1.55;
    margin-bottom: clamp(24px, 4vh, 40px);
    padding: 0 8px;
  }

  /* Primary CTA Button */
  .btn-primary-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-heading);
    font-size: clamp(14px, 1.4vw, 15.5px);
    font-weight: 600;
    color: var(--accent-dark);
    background-color: var(--accent);
    padding: clamp(12px, 1.8vh, 14px) clamp(24px, 3vw, 32px);
    border-radius: 9999px;
    text-decoration: none;
    box-shadow: 0 14px 34px -12px rgba(37, 211, 102, 0.4);
    transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    white-space: nowrap;
  }

  .btn-primary-cta svg {
    width: 16px;
    height: 16px;
    transition: transform 0.2s ease;
  }

  .btn-primary-cta:hover {
    transform: translateY(-2px);
    background-color: var(--accent-hover);
    box-shadow: 0 18px 40px -10px rgba(37, 211, 102, 0.5);
  }

  .btn-primary-cta:hover svg {
    transform: translateX(3px);
  }

  /* ── Corner Captions ── */
  .corner-caption {
    position: fixed;
    bottom: 30px;
    z-index: 11;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    pointer-events: none;
  }

  .caption-left {
    left: clamp(20px, 4vw, 56px);
  }

  .caption-right {
    right: clamp(20px, 4vw, 56px);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .caption-right svg {
    width: 13px;
    height: 13px;
    opacity: 0.7;
  }

  /* ── Footer Spacer ── */
  .hero-spacer {
    height: clamp(20px, 4vh, 60px);
  }

  /* ── Reduced Motion Guard ── */
  @media (prefers-reduced-motion: reduce) {
    .rise {
      opacity: 1 !important;
      filter: none !important;
      transform: none !important;
      animation: none !important;
    }
  }

  /* ── Responsive Media Queries ── */
  @media (max-width: 960px) {
    .nav-links {
      display: none;
    }
    .corner-caption {
      display: none;
    }
  }

  @media (max-height: 700px) {
    html, body {
      overflow-y: auto;
    }
    .corner-caption {
      display: none;
    }
    .hero-shell {
      min-height: 600px;
    }
  }

  @media (max-width: 480px) {
    .kicker-rule {
      display: none;
    }
    .kicker-text {
      letter-spacing: 0.25em;
    }
    .headline-line1, .headline-line2 {
      display: inline;
    }
  }
</style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Three.js Ambient Network Script -->
  <script>
    (function initThreeNetwork() {
      const canvas = document.getElementById('bgCanvas');
      if (!canvas) return;

      // Reduced motion check
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let renderer, scene, camera, points, lines;

      // Adapt node count based on screen width
      const isMobile = window.innerWidth <= 960;
      const NODE_COUNT = isMobile ? 35 : 75;
      const CONNECTION_THRESHOLD = 3.2;
      const PULSE_NODE_COUNT = 6;

      try {
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      } catch (e) {
        // Fallback: hide canvas gracefully if WebGL is unavailable
        canvas.style.display = 'none';
        return;
      }

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 9;

      // Create Nodes Geometry
      const positions = new Float32Array(NODE_COUNT * 3);
      const nodeVelocities = [];
      const nodeColors = new Float32Array(NODE_COUNT * 3);

      // Default color (off-white)
      const defaultColor = new THREE.Color(0xe8e9ec);
      // Accent pulse color (#25d366)
      const accentColor = new THREE.Color(0x25d366);

      // Randomly pick pulse node indices
      const pulseIndices = new Set();
      while (pulseIndices.size < PULSE_NODE_COUNT) {
        pulseIndices.add(Math.floor(Math.random() * NODE_COUNT));
      }

      for (let i = 0; i < NODE_COUNT; i++) {
        // Distribute in a spherical volume
        const radius = 2.5 + Math.random() * 3.5;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);

        positions[i * 3]     = radius * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = radius * Math.cos(phi);

        nodeVelocities.push({
          x: (Math.random() - 0.5) * 0.002,
          y: (Math.random() - 0.5) * 0.002,
          z: (Math.random() - 0.5) * 0.002
        });

        const isPulseNode = pulseIndices.has(i);
        const c = isPulseNode ? accentColor : defaultColor;
        nodeColors[i * 3]     = c.r;
        nodeColors[i * 3 + 1] = c.g;
        nodeColors[i * 3 + 2] = c.b;
      }

      // Buffer Geometry for points
      const pointGeo = new THREE.BufferGeometry();
      pointGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      pointGeo.setAttribute('color', new THREE.BufferAttribute(nodeColors, 3));

      const pointMat = new THREE.PointsMaterial({
        size: 0.06,
        vertexColors: true,
        transparent: true,
        opacity: 0.75,
        sizeAttenuation: true
      });

      points = new THREE.Points(pointGeo, pointMat);
      scene.add(points);

      // Connecting Lines
      const maxLines = NODE_COUNT * NODE_COUNT;
      const linePositions = new Float32Array(maxLines * 6);
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

      const lineMat = new THREE.LineBasicMaterial({
        color: 0xe8e9ec,
        transparent: true,
        opacity: 0.12
      });

      lines = new THREE.LineSegments(lineGeo, lineMat);
      scene.add(lines);

      function updateConnections() {
        const pos = points.geometry.attributes.position.array;
        let lineIdx = 0;

        for (let i = 0; i < NODE_COUNT; i++) {
          for (let j = i + 1; j < NODE_COUNT; j++) {
            const dx = pos[i * 3]     - pos[j * 3];
            const dy = pos[i * 3 + 1] - pos[j * 3 + 1];
            const dz = pos[i * 3 + 2] - pos[j * 3 + 2];
            const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

            if (dist < CONNECTION_THRESHOLD) {
              linePositions[lineIdx++] = pos[i * 3];
              linePositions[lineIdx++] = pos[i * 3 + 1];
              linePositions[lineIdx++] = pos[i * 3 + 2];
              linePositions[lineIdx++] = pos[j * 3];
              linePositions[lineIdx++] = pos[j * 3 + 1];
              linePositions[lineIdx++] = pos[j * 3 + 2];
            }
          }
        }

        // Zero out unused vertices
        for (let k = lineIdx; k < linePositions.length; k++) {
          linePositions[k] = 0;
        }

        lines.geometry.attributes.position.needsUpdate = true;
        lines.geometry.setDrawRange(0, lineIdx / 3);
      }

      // Initial lines render
      updateConnections();

      // Render loop
      let clock = new THREE.Clock();

      function animate() {
        if (prefersReducedMotion) {
          renderer.render(scene, camera);
          return; // Stop animation loop for reduced motion preference
        }

        requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();

        const pos = points.geometry.attributes.position.array;
        for (let i = 0; i < NODE_COUNT; i++) {
          pos[i * 3]     += nodeVelocities[i].x;
          pos[i * 3 + 1] += nodeVelocities[i].y;
          pos[i * 3 + 2] += nodeVelocities[i].z;

          // Boundary bounce
          if (Math.abs(pos[i * 3]) > 4.5)     nodeVelocities[i].x *= -1;
          if (Math.abs(pos[i * 3 + 1]) > 3.5) nodeVelocities[i].y *= -1;
          if (Math.abs(pos[i * 3 + 2]) > 3.5) nodeVelocities[i].z *= -1;
        }

        points.geometry.attributes.position.needsUpdate = true;
        updateConnections();

        // Slow continuous axis rotation (~100s per rotation)
        const rotationSpeed = (Math.PI * 2) / 100;
        points.rotation.y = elapsedTime * rotationSpeed;
        lines.rotation.y  = elapsedTime * rotationSpeed;

        // Subtle gentle pulsing for accent nodes
        const pulseOpacity = 0.5 + Math.sin(elapsedTime * 2.5) * 0.25;
        pointMat.opacity = pulseOpacity;

        renderer.render(scene, camera);
      }

      animate();

      // Window resize handler
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
